services:
  app:
    container_name: chimera-app
    build:
      context: ./chimera-app
    volumes:
      - ./chimera-app:/chimera-app
    ports:
      - 3000:3000
      - 24678:24678 # HMR(Hot Module Replacement)用のポートを追加
      - 7777:7777 # eslint config-inspector用のポートを追加
    # env_file: ./chimera-app/.env
    tty: true
    stdin_open: true
    networks:
      - supabase_network_chimera

  collab:
    container_name: chimera-collab
    build:
      context: ./chimera-collab
    volumes:
      - ./chimera-collab:/chimera-collab
      # - /chimera-collab/node_modules # ホスト側にnode_modulesが無くてもコンテナ内installを上書きしないようにする
    ports:
      - 1234:1234 # y-websocket (React Flow 共同編集) 用ポート
    # env_file: ./chimera-collab/.env
    tty: true
    stdin_open: true
    networks:
      - supabase_network_chimera

networks:
  supabase_network_chimera:
    external: true
